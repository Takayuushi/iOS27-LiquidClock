          file "$FONT_OUTPUT" | grep -q "TrueType Font data"

      - name: Build debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-LiquidClock-Android17-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
