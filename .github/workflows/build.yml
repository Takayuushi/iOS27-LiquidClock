name: Android 17 APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-build-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android 17 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Download SF Pro Display Thin OTF font
        shell: bash
        run: |
          set -euo pipefail

          FONT_DIR="app/src/main/res/font"
          FONT_OUTPUT="$FONT_DIR/sf_pro_display.otf"
          FONT_URL="https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/8bfea09aa6f1139479f80358b2e1e5c6dc991a58/SF-Pro-Display-Thin.otf"

          mkdir -p "$FONT_DIR"

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$FONT_URL" \
            --output "$FONT_OUTPUT"

          test -s "$FONT_OUTPUT"

          FONT_BYTES="$(stat -c '%s' "$FONT_OUTPUT")"
          if [[ "$FONT_BYTES" -lt 1000000 ]]; then
            echo "Downloaded font is unexpectedly small: ${FONT_BYTES} bytes" >&2
            exit 1
          fi

          FONT_DESCRIPTION="$(file "$FONT_OUTPUT")"
          echo "$FONT_DESCRIPTION"
          if ! grep -Eqi 'OpenType|font data' <<< "$FONT_DESCRIPTION"; then
            echo "Downloaded file is not recognized as an OpenType font." >&2
            exit 1
          fi

          MAGIC="$(od -An -tx1 -N4 "$FONT_OUTPUT" | tr -d ' \n')"
          if [[ "$MAGIC" != "4f54544f" && "$MAGIC" != "00010000" ]]; then
            echo "Unexpected font signature: $MAGIC" >&2
            exit 1
          fi

          ASSET_FONT_DIR="app/src/main/assets/fonts"
          mkdir -p "$ASSET_FONT_DIR"
          cp "$FONT_OUTPUT" "$ASSET_FONT_DIR/sf_pro_display.otf"
          test -s "$ASSET_FONT_DIR/sf_pro_display.otf"

          echo "SF Pro Display Thin ready for Android resources and Canvas renderer."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-LiquidClock-Android17-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
