name: Android 17 APK Build

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - 'clock-renderer/**'
      - '.github/workflows/build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'clock-renderer/**'
      - '.github/workflows/build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

# Serialize builds on the same branch so the first debug-signing cache entry
# is created once and then reused by every later APK.
concurrency:
  group: android17-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android 17 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Install official Apple SF Pro variable font and display faces
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${RUNNER_TEMP}/apple-sf-pro"
          mkdir -p "$WORK_DIR"

          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi

          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            "https://devimages-cdn.apple.com/design/resources/download/SF-Pro.dmg" \
            --output "$WORK_DIR/SF-Pro.dmg"

          echo "Official Apple SF-Pro.dmg: $(stat -c '%s' "$WORK_DIR/SF-Pro.dmg") bytes"
          7z x -y "$WORK_DIR/SF-Pro.dmg" -o"$WORK_DIR" >/dev/null

          while IFS= read -r -d '' PKG; do
            7z x -y "$PKG" -o"$WORK_DIR" >/dev/null
          done < <(find "$WORK_DIR" -type f -name '*.pkg' -print0)

          # The installer wraps the CPIO Payload~ inside a gzip Payload.
          while IFS= read -r -d '' PAYLOAD; do
            7z x -y "$PAYLOAD" -o"$WORK_DIR" >/dev/null
          done < <(find "$WORK_DIR" -type f -name 'Payload' -print0)

          while IFS= read -r -d '' PAYLOAD; do
            7z x -y "$PAYLOAD" -o"$WORK_DIR" >/dev/null
          done < <(find "$WORK_DIR" -type f -name 'Payload~' -print0)

          find_font() {
            local name="$1"
            local found
            found="$(find "$WORK_DIR" -type f -name "$name" -print -quit)"
            if [[ -z "$found" ]]; then
              echo "Official Apple font not found: $name" >&2
              exit 1
            fi
            printf '%s' "$found"
          }

          FONT_DIR="app/src/main/res/font"
          ASSET_FONT_DIR="clock-renderer/src/main/assets/fonts"
          mkdir -p "$FONT_DIR" "$ASSET_FONT_DIR"

          VARIABLE_FONT="$(find_font 'SF-Pro.ttf')"
          DISPLAY_THIN="$(find_font 'SF-Pro-Display-Thin.otf')"
          DISPLAY_LIGHT="$(find_font 'SF-Pro-Display-Light.otf')"
          DISPLAY_BOLD="$(find_font 'SF-Pro-Display-Bold.otf')"

          cp "$VARIABLE_FONT" "$ASSET_FONT_DIR/SF-Pro.ttf"
          cp "$DISPLAY_THIN" "$FONT_DIR/sf_pro_display_thin.otf"
          cp "$DISPLAY_LIGHT" "$FONT_DIR/sf_pro_display_light.otf"
          cp "$DISPLAY_BOLD" "$FONT_DIR/sf_pro_display_bold.otf"
          cp "$DISPLAY_THIN" "$ASSET_FONT_DIR/sf_pro_display_thin.otf"
          cp "$DISPLAY_LIGHT" "$ASSET_FONT_DIR/sf_pro_display_light.otf"

          test -s "$ASSET_FONT_DIR/SF-Pro.ttf"
          test -s "$FONT_DIR/sf_pro_display_thin.otf"
          test -s "$FONT_DIR/sf_pro_display_light.otf"
          test -s "$FONT_DIR/sf_pro_display_bold.otf"

          python3 -m pip install --disable-pip-version-check --quiet fonttools
          python3 - "$ASSET_FONT_DIR/SF-Pro.ttf" <<'PY'
          import sys
          from fontTools.ttLib import TTFont

          path = sys.argv[1]
          font = TTFont(path)
          if "fvar" not in font:
              raise SystemExit("Apple SF-Pro.ttf has no fvar variable-font table.")

          axes = {
              axis.axisTag: (axis.minValue, axis.defaultValue, axis.maxValue)
              for axis in font["fvar"].axes
          }
          print("Official Apple SF Pro variable axes:")
          for tag, values in sorted(axes.items()):
              print(f"  {tag}: min={values[0]:g}, default={values[1]:g}, max={values[2]:g}")

          for required in ("wght", "wdth"):
              axis = axes.get(required)
              if axis is None or axis[0] >= axis[2]:
                  raise SystemExit(f"Official Apple SF Pro is missing a working {required} axis.")

          print("Official Apple SF Pro named width/weight instances:")
          name_table = font["name"]
          for instance in font["fvar"].instances:
              label = name_table.getDebugName(instance.subfamilyNameID) or "Unnamed"
              coords = ", ".join(f"{tag}={value:g}" for tag, value in instance.coordinates.items())
              print(f"  {label}: {coords}")

          if "STAT" in font:
              stat = font["STAT"].table
              axes_record = getattr(getattr(stat, "DesignAxisRecord", None), "Axis", []) or []
              print("Official Apple SF Pro STAT axes:")
              for axis in axes_record:
                  print(f"  {axis.AxisTag}: {name_table.getDebugName(axis.AxisNameID)}")
              values = getattr(getattr(stat, "AxisValueArray", None), "AxisValue", []) or []
              for value in values:
                  label = name_table.getDebugName(value.ValueNameID)
                  print(f"  named value: {label}")
          PY

          # Only the live clock's digits and colon are used at runtime.
          # Apple's complete family contains many scripts and glyphs that would
          # otherwise be mapped into a new direct buffer for every weight/width
          # variation. Keep the official variable axes but subset the cmap.
          python3 - "$ASSET_FONT_DIR/SF-Pro.ttf" <<'PY'
          import os
          import sys
          from fontTools.ttLib import TTFont
          from fontTools.subset import Options, Subsetter

          path = sys.argv[1]
          original_size = os.path.getsize(path)
          font = TTFont(path)

          options = Options()
          options.name_IDs = ["*"]
          options.name_languages = ["*"]
          options.layout_features = ["*"]
          options.glyph_names = True
          options.notdef_glyph = True
          options.notdef_outline = True
          options.recommended_glyphs = True

          subsetter = Subsetter(options=options)
          subsetter.populate(text="0123456789:")
          subsetter.subset(font)

          axes = {axis.axisTag for axis in font["fvar"].axes}
          if not {"wght", "wdth"}.issubset(axes):
              raise SystemExit("Subsetting unexpectedly removed Apple's weight/width axes.")

          temporary = path + ".clock-subset"
          font.save(temporary)
          font.close()

          check = TTFont(temporary)
          check_axes = {axis.axisTag for axis in check["fvar"].axes}
          if not {"wght", "wdth"}.issubset(check_axes):
              raise SystemExit("Clock subset is missing the variable weight/width axes.")
          if "cmap" not in check or "glyf" not in check:
              raise SystemExit("Clock subset is missing its TrueType character outlines.")
          check.close()

          subset_size = os.path.getsize(temporary)
          if subset_size > 1_000_000:
              raise SystemExit(f"Clock font subset is unexpectedly large: {subset_size} bytes")
          os.replace(temporary, path)
          print(
              f"Clock-only SF Pro variable font: {original_size:,} -> "
              f"{subset_size:,} bytes (digits 0-9 and colon; wght/wdth retained)"
          )
          PY

          echo "Official Apple SF Pro clock subset and display faces installed into build assets."

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ios27-liquidclock-debug-signing-${{ github.ref_name }}-v1

      - name: Initialise persistent debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "No saved debug signing key found; creating the branch's stable key."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Restored the existing debug signing key."
          fi
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-LiquidClock-Android17-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
