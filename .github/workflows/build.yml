name: Android 17 APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android 17 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 platform and build tools
        run: |
          sdkmanager --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          ls -la "$ANDROID_SDK_ROOT/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Restore embedded thin clock font from Base64
        shell: bash
        run: |
          set -euo pipefail

          FONT_OUTPUT="app/src/main/res/font/sf_pro_display.ttf"
          mkdir -p "$(dirname "$FONT_OUTPUT")"

