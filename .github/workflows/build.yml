name: Android 17 APK Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-build-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android 17 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Ingest Official SF Pro Fonts from Repository
        shell: bash
        run: |
          set -euo pipefail

          FONT_DIR="app/src/main/res/font"
          ASSET_FONT_DIR="app/src/main/assets/fonts"
          mkdir -p "$FONT_DIR" "$ASSET_FONT_DIR"

          THIN_URL="https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/8bfea09aa6f1139479f80358b2e1e5c6dc991a58/SF-Pro-Display-Thin.otf"
          LIGHT_URL="https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/8bfea09aa6f1139479f80358b2e1e5c6dc991a58/SF-Pro-Display-Light.otf"
          BOLD_URL="https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/8bfea09aa6f1139479f80358b2e1e5c6dc991a58/SF-Pro-Display-Bold.otf"
          VARIABLE_URL="https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/8bfea09aa6f1139479f80358b2e1e5c6dc991a58/SF-Pro.ttf"

          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            "$THIN_URL" --output "$FONT_DIR/sf_pro_display_thin.otf"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            "$LIGHT_URL" --output "$FONT_DIR/sf_pro_display_light.otf"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            "$BOLD_URL" --output "$FONT_DIR/sf_pro_display_bold.otf"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            "$VARIABLE_URL" --output "$ASSET_FONT_DIR/SF-Pro.ttf"

          for FONT in "$FONT_DIR/sf_pro_display_thin.otf" "$FONT_DIR/sf_pro_display_light.otf" "$FONT_DIR/sf_pro_display_bold.otf"; do
            test -s "$FONT"
            MAGIC="$(od -An -tx1 -N4 "$FONT" | tr -d ' \n')"
            if [[ "$MAGIC" != "4f54544f" && "$MAGIC" != "00010000" ]]; then
              echo "Invalid OpenType/TrueType signature in $FONT: $MAGIC" >&2
              exit 1
            fi
            file "$FONT"
          done

          # Keep res/font/sf_pro_display.xml as the single resource named
          # sf_pro_display; do not generate a second sf_pro_display.otf resource.
          cp "$FONT_DIR/sf_pro_display_thin.otf" "$ASSET_FONT_DIR/sf_pro_display_thin.otf"
          cp "$FONT_DIR/sf_pro_display_light.otf" "$ASSET_FONT_DIR/sf_pro_display_light.otf"
          test -s "$FONT_DIR/sf_pro_display_thin.otf"
          test -s "$FONT_DIR/sf_pro_display_light.otf"
          test -s "$FONT_DIR/sf_pro_display_bold.otf"
          test -s "$ASSET_FONT_DIR/SF-Pro.ttf"
          test -s "$ASSET_FONT_DIR/sf_pro_display_thin.otf"
          test -s "$ASSET_FONT_DIR/sf_pro_display_light.otf"
          MAGIC="$(od -An -tx1 -N4 "$ASSET_FONT_DIR/SF-Pro.ttf" | tr -d ' \\n')"
          if [[ "$MAGIC" != "00010000" ]]; then
            echo "Invalid variable SF Pro font signature: $MAGIC" >&2
            exit 1
          fi

          echo "SF Pro Display assets and variable SF Pro downloaded and validated."

      - name: Verify SF Pro variable-font axes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet fonttools
          python3 - <<'PY'
          from fontTools.ttLib import TTFont

          path = "app/src/main/assets/fonts/SF-Pro.ttf"
          font = TTFont(path)
          if "fvar" not in font:
              raise SystemExit("SF-Pro.ttf is not a variable font (missing fvar table).")

          axes = {
              axis.axisTag: (axis.minValue, axis.defaultValue, axis.maxValue)
              for axis in font["fvar"].axes
          }
          print("SF Pro variation axes:")
          for tag, values in sorted(axes.items()):
              print(f"  {tag}: min={values[0]}, default={values[1]}, max={values[2]}")

          if "wght" not in axes or axes["wght"][0] >= axes["wght"][2]:
              raise SystemExit("SF-Pro.ttf must expose a genuine variable wght axis.")

          for optional_axis in ("wdth", "opsz"):
              axis = axes.get(optional_axis)
              if axis is None or axis[0] >= axis[2]:
                  print(
                      f"{optional_axis} is not variable in this SF Pro asset; "
                      "the renderer uses per-glyph vector profiles for optical adaptation."
                  )
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-LiquidClock-Android17-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  preview-emulator:
    name: Render live wallpaper preview on Android 17 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: iOS27-LiquidClock-Android17-debug
          path: app/build/outputs/apk/debug

      - name: Update SDK command-line tools for versioned Android 17 packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          # Ubuntu hosted images may ship cmdline-tools 12.0, which writes an
          # invalid android-0 target for android-37.0 system images. Update
          # to 22.0 before avdmanager creates the API 37.0 virtual device.
          # sdkmanager closes stdin after accepting its prompt; `yes` then gets
          # SIGPIPE. Ignore that producer exit while preserving sdkmanager's exit code.
          set +o pipefail
          yes 2>/dev/null | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" >/dev/null
          set -o pipefail
          if [[ -d "$SDK_ROOT/cmdline-tools/latest-2" ]]; then
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/latest-2" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Launch wallpaper preview and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37.0
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_8
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p preview-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.example.ios27clock/.PreviewTestActivity
            sleep 12
            adb exec-out screencap -p > preview-artifacts/live-wallpaper-preview.png
            adb logcat -d -t 6000 > preview-artifacts/logcat.txt
            adb shell dumpsys wallpaper > preview-artifacts/wallpaper-service.txt

            if [[ ! -s preview-artifacts/live-wallpaper-preview.png ]]; then
              echo "Emulator screenshot was not created." >&2
              exit 1
            fi

      - name: Upload emulator preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-LiquidClock-Android17-preview
          path: preview-artifacts/
          if-no-files-found: warn
          retention-days: 14
