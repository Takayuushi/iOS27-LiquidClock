name: Liquid Clock Digit Lab APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digit-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Digit Lab APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 17 SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"
          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Prepare official SF Pro clock font assets
        run: bash .github/scripts/prepare-digit-lab-fonts.sh
      - name: Restore persistent Digit Lab debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: digit-lab-debug-signing-${{ github.ref_name }}-v1

      - name: Initialise persistent Digit Lab debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "No saved Digit Lab signing key found; creating this branch's stable key."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Restored the existing Digit Lab signing key."
          fi
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Build standalone Digit Lab debug APK
        run: gradle -p digit-lab assembleDebug
      - name: Upload standalone Digit Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-clock-digit-lab-debug
          path: digit-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
